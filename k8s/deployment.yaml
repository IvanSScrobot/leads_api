apiVersion: apps/v1
kind: Deployment
metadata:
  name: ardent-intake-api
  namespace: default
  labels:
    app: ardent-intake-api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ardent-intake-api
  template:
    metadata:
      labels:
        app: ardent-intake-api
        version: v1
    spec:
      containers:
        - name: ardent-intake-api
          image: ivansscrobot/ardent-leads-api:0.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            # HMAC secret keys loaded from Kubernetes Secret
            - name: HMAC_SECRET_KEY_PK_TEST_123
              valueFrom:
                secretKeyRef:
                  name: ardent-intake-hmac-secret
                  key: HMAC_SECRET_KEY_PK_TEST_123
            - name: HMAC_SECRET_KEY_PK_TEST_456
              valueFrom:
                secretKeyRef:
                  name: ardent-intake-hmac-secret
                  key: HMAC_SECRET_KEY_PK_TEST_456

            # PostgreSQL database credentials for survey endpoint
            - name: POSTGRES_HOST
              value: "postgres-service" # This should match the service name for PostgreSQL
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

            # Optional: Phone validation configuration
            - name: INTERNATIONAL_NUMBERS_ALLOWED
              value: "false"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/leads/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/leads/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
